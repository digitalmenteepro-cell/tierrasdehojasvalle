/* Loader */.module-loading{min-height:80px;display:flex;align-items:center;justify-content:center}.module-loading::after{content:'';width:28px;height:28px;border:3px solid rgba(61,122,46,.15);border-top-color:var(--green);border-radius:50%;animation:spin .6s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}</style>

<body>

  <div id="mod-nav"></div>
  <div id="mod-portada"></div>
  <div id="mod-promociones"></div>
  <div id="mod-producto"></div>
  <div id="mod-banner-familia"></div>
  <div id="mod-galeria"></div>
  <div id="mod-testimonios"></div>
  <div id="mod-contacto"></div>

  <script>
    // Base URL automática — funciona en GitHub Pages y en local
    const BASE = window.location.pathname.replace(/\/[^\/]*$/, '/');

    const MODULES = [
      { id: 'mod-nav',            file: 'nav.html'           },
      { id: 'mod-portada',        file: 'portada.html'       },
      { id: 'mod-promociones',    file: 'promociones.html'   },
      { id: 'mod-producto',       file: 'producto.html'      },
      { id: 'mod-banner-familia', file: 'banner-familia.html'},
      { id: 'mod-galeria',        file: 'galeria.html'       },
      { id: 'mod-testimonios',    file: 'testimonios.html'   },
      { id: 'mod-contacto',       file: 'contacto.html'      },
    ];

    // Spinner en cada contenedor mientras carga
    MODULES.forEach(m => {
      const el = document.getElementById(m.id);
      if (el) el.classList.add('module-loading');
    });

    // Carga un módulo e inyecta su HTML
    async function loadModule({ id, file }) {
      const container = document.getElementById(id);
      if (!container) return;
      try {
        const url = BASE + file;
        const res = await fetch(url);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const html = await res.text();
        container.classList.remove('module-loading');
        container.innerHTML = html;
        // Re-ejecutar scripts dentro del módulo
        container.querySelectorAll('script').forEach(old => {
          const s = document.createElement('script');
          [...old.attributes].forEach(a => s.setAttribute(a.name, a.value));
          s.textContent = old.textContent;
          old.parentNode.replaceChild(s, old);
        });
      } catch (err) {
        container.classList.remove('module-loading');
        container.style.display = 'none';
        console.warn('[Modular] No se pudo cargar ' + file + ':', err.message);
      }
    }

    // Cargar todos en paralelo, luego activar animaciones
    Promise.all(MODULES.map(loadModule)).then(() => {

      // Animaciones reveal al hacer scroll
      const obs = new IntersectionObserver(entries => {
        entries.forEach(e => {
          if (e.isIntersecting) {
            e.target.classList.add('visible');
            obs.unobserve(e.target);
          }
        });
      }, { threshold: .12, rootMargin: '0px 0px -30px 0px' });
      document.querySelectorAll('.reveal').forEach(r => obs.observe(r));

      // Sombra nav al hacer scroll
      window.addEventListener('scroll', () => {
        const nav = document.querySelector('nav');
        if (nav) nav.style.boxShadow =
          window.scrollY > 60
            ? '0 4px 20px rgba(0,0,0,.1)'
            : '0 2px 12px rgba(0,0,0,.06)';
      });

    });
  </script>
