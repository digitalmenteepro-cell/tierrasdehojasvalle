<!-- ============================================================
     SECCIÓN 6: GALERÍA (galeria.html)
     Grid de 3 fotos con efecto hover
     Pégalo después de los beneficios
     ============================================================ -->

<style>
  .galeria { background: #fff; padding: 80px 5%; }
  .sec-sub {
    font-size: 15px; color: #666; line-height: 1.7; max-width: 540px;
  }
  .gal-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px; margin-top: 36px;
  }
  .gal-item {
    border-radius: 14px; overflow: hidden;
    aspect-ratio: 1; position: relative; cursor: pointer;
  }
  .gal-item img {
    width: 100%; height: 100%;
    object-fit: cover; transition: transform .4s;
  }
  .gal-item:hover img { transform: scale(1.06); }
  .gal-overlay {
    position: absolute; inset: 0;
    background: rgba(61,122,46,.75);
    display: flex; align-items: center; justify-content: center;
    opacity: 0; transition: opacity .3s;
  }
  .gal-item:hover .gal-overlay { opacity: 1; }
  .gal-overlay span {
    color: #fff; font-size: 13px; font-weight: 700;
    display: flex; align-items: center; gap: 6px;
  }

  @media(max-width:600px) {
    .gal-grid { grid-template-columns: 1fr 1fr; }
  }
</style>

<!-- SECCIÓN GALERÍA -->
<section class="galeria" id="galeria">

  <div class="sec-tag reveal">Nuestro trabajo</div>
  <h2 class="sec-title reveal">
    Tus plantas siguen creciendo...<br>
    <span>¿y tu sustrato?</span>
  </h2>
  <p class="sec-sub reveal">
    Así se ve nuestro producto en acción. Resultados reales de clientes reales.
  </p>

  <div class="gal-grid">

    <div class="gal-item reveal">
      <img
        src="https://raw.githubusercontent.com/digitalmenteepro-cell/tierradehojasvalle/main/img/IMG_7284.jpg"
        alt="Sustrato Tierra de Hojas Valle en acción"
      />
      <div class="gal-overlay">
        <span><i class="fas fa-leaf"></i> Sustrato en acción</span>
      </div>
    </div>

    <div class="gal-item reveal">
      <img
        src="https://raw.githubusercontent.com/digitalmenteepro-cell/tierradehojasvalle/main/img/IMG_7285.jpg"
        alt="Familia cuidando plantas con sustrato Valle"
      />
      <div class="gal-overlay">
        <span><i class="fas fa-box"></i> Bolsas disponibles</span>
      </div>
    </div>

    <div class="gal-item reveal">
      <img
        src="https://raw.githubusercontent.com/digitalmenteepro-cell/tierradehojasvalle/main/img/IMG_7287.jpg"
        alt="Producto Carpediem certificado SAG"
      />
      <div class="gal-overlay">
        <span><i class="fas fa-certificate"></i> Cert. SAG</span>
      </div>
    </div>

  </div>
</section>
